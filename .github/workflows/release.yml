# Build the Dice & Destiny books and publish the PDFs as a GitHub release.
# A push to main makes a preview pre-release. A tag edition-N makes a full release.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "compendium/**"
      - "!compendium/**/*.md"
      - ".github/workflows/release.yml"
    tags:
      - "edition-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_PREVIEWS: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # These fonts give the same page breaks as the baseline build.
      # Do not add fonts-gfs-baskerville: the baseline uses Caladea in its place.
      - name: Install the build tools and the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-crosextra-caladea fonts-liberation fonts-inter
          pip install "markdown==3.11.3" "pypdf==6.17.0" "pytest==8.3.4"
          google-chrome --version

      - name: Run the tests
        run: cd compendium && python3 -m pytest -q

      - name: Build the books
        run: compendium/build.sh

      # Stop here if a PDF has a font that changes the page breaks.
      - name: Check the fonts
        run: python3 compendium/build/check_fonts.py compendium/dist/*.pdf

      # The books never use an em-dash.
      - name: Check for em-dashes
        run: |
          dash=$(printf '\342\200\224')  # the UTF-8 bytes of an em-dash
          bad=0
          for f in compendium/dist/*.pdf; do
            n=$(pdftotext "$f" - | grep -o "$dash" | wc -l)
            if [ "$n" -gt 0 ]; then echo "EM-DASH ERROR: $f has $n"; bad=1; fi
          done
          exit $bad

      - name: Show the page counts
        run: |
          for f in compendium/dist/*.pdf; do
            echo "$(pdfinfo "$f" | awk '/^Pages/{print $2}') pages: $f"
          done

      # GitHub changes special characters in the names of release files.
      # Give each file a plain name, and keep the full title as its label.
      - name: Name the release files
        run: |
          mkdir -p release
          : > assets.txt
          for book in "Player's Compendium:players-compendium" "Game Master's Compendium:game-masters-compendium"; do
            title="${book%%:*}"; slug="${book##*:}"; src="compendium/dist/Dice & Destiny - ${title}"
            while IFS='|' read -r kind file label; do
              cp "${src} - ${file}.pdf" "release/dice-and-destiny-${slug}-${kind}.pdf"
              echo "release/dice-and-destiny-${slug}-${kind}.pdf#Dice & Destiny: The ${title}, ${label}" >> assets.txt
            done <<'LIST'
          screen|Screen (color)|for reading on a screen (color, with links and bookmarks)
          home-print|Home Print (A4, B&W)|for printing at home (A4, black and white, with a front page)
          lulu-interior|Lulu Interior (A4, B&W)|Lulu hardcover interior (A4, black and white)
          lulu-cover|Lulu Hardcover Cover|Lulu hardcover cover (A4 casewrap)
          LIST
          done
          cat assets.txt
          test "$(wc -l < assets.txt)" -eq 8

      - name: Publish a preview release
        if: github.ref == 'refs/heads/main'
        run: |
          day=$(date -u +%Y.%m.%d)
          tag="preview-${day}-${GITHUB_SHA::7}"
          mapfile -t assets < assets.txt
          gh release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Dice & Destiny preview ${day} (${GITHUB_SHA::7})" \
            --notes "Preview build of commit ${GITHUB_SHA}. This is not an edition."

      - name: Delete the old previews
        if: github.ref == 'refs/heads/main'
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("preview-"))] | sort_by(.createdAt) | reverse | .[env.KEEP_PREVIEWS | tonumber:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Publish an edition release
        if: startsWith(github.ref, 'refs/tags/edition-')
        run: |
          n="${GITHUB_REF_NAME#edition-}"
          mapfile -t assets < assets.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --latest \
            --title "Dice & Destiny: Edition ${n}" \
            --notes "Edition ${n} of Dice & Destiny."

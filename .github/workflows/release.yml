# Build the Dice & Destiny books and publish the PDFs as GitHub releases.
# A push to main makes a preview pre-release with all books.
# A tag edition-N makes a release of the two Compendiums.
# A tag dawnwatch-waking-N makes a release of The Dawnwatch, Book One: Waking.
# A tag western-sea-N makes a release of Beyond the Western Sea.
# Each product release also replaces the files of the rolling release of its product:
# compendium-latest, dawnwatch-waking-latest, or western-sea-latest. The README links to these files.
# The workflow does not write commits.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "compendium/**"
      - "!compendium/README.md"
      - "adventures/**"
      - ".github/workflows/release.yml"
    tags:
      - "edition-*"
      - "dawnwatch-waking-*"
      - "western-sea-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_PREVIEWS: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # These fonts give the same page breaks as the baseline build.
      # Do not add fonts-gfs-baskerville: the baseline uses Caladea in its place.
      - name: Install the build tools and the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-crosextra-caladea fonts-liberation fonts-inter
          pip install "markdown==3.11.3" "pypdf==6.17.0" "pytest==8.3.4"
          google-chrome --version

      - name: Run the tests
        run: cd compendium && python3 -m pytest -q

      # The design says that a Dawnwatch book is not released until each of its maps
      # is a final map in compendium/maps/. A preview map is good enough for a preview release only.
      - name: Check that the maps of Waking are final
        if: startsWith(github.ref, 'refs/tags/dawnwatch-waking-')
        run: cd compendium && PYTHONPATH=.:build python3 build/waking.py --check-maps

      # The same rule applies to Beyond the Western Sea.
      - name: Check that the maps of Beyond the Western Sea are final
        if: startsWith(github.ref, 'refs/tags/western-sea-')
        run: cd compendium && PYTHONPATH=.:build python3 build/western_sea.py --check-maps

      # The book uses only six-sided dice tables. Stop if the book source has a d20 or a d100.
      - name: Check the dice of Beyond the Western Sea
        if: startsWith(github.ref, 'refs/tags/western-sea-')
        run: cd compendium && PYTHONPATH=.:build python3 build/western_sea.py --check

      - name: Build the books
        run: compendium/build.sh

      # Stop here if a PDF has a font that changes the page breaks.
      - name: Check the fonts
        run: python3 compendium/build/check_fonts.py compendium/dist/*.pdf

      # The books never use an em-dash.
      - name: Check for em-dashes
        run: |
          dash=$(printf '\342\200\224')  # the UTF-8 bytes of an em-dash
          bad=0
          for f in compendium/dist/*.pdf; do
            n=$(pdftotext "$f" - | grep -o "$dash" | wc -l)
            if [ "$n" -gt 0 ]; then echo "EM-DASH ERROR: $f has $n"; bad=1; fi
          done
          exit $bad

      - name: Show the page counts
        run: |
          for f in compendium/dist/*.pdf; do
            echo "$(pdfinfo "$f" | awk '/^Pages/{print $2}') pages: $f"
          done

      # GitHub changes special characters in the names of release files.
      # Give each file a plain name, and keep the full title as its label.
      # assets-compendium.txt, assets-waking.txt, and assets-western-sea.txt hold the files of each product.
      # The build makes Beyond the Western Sea only after build.sh has the book.
      # Until then, the step adds the book only when its screen PDF is in compendium/dist/.
      # A western-sea tag always needs all 5 files of the book.
      - name: Name the release files
        run: |
          mkdir -p release
          : > assets-compendium.txt
          : > assets-waking.txt
          : > assets-western-sea.txt
          books=("Player's Compendium:players-compendium:compendium:The Player's Compendium"
                 "Game Master's Compendium:game-masters-compendium:compendium:The Game Master's Compendium"
                 "The Dawnwatch, Book One - Waking:the-dawnwatch-waking:waking:The Dawnwatch, Book One: Waking")
          western_sea=false
          if [[ "$GITHUB_REF" == refs/tags/western-sea-* ]] || \
             [ -f "compendium/dist/Dice & Destiny - Beyond the Western Sea - Screen (color).pdf" ]; then
            western_sea=true
            books+=("Beyond the Western Sea:beyond-the-western-sea:western-sea:Beyond the Western Sea")
          fi
          for book in "${books[@]}"; do
            IFS=':' read -r title slug product label_title <<< "$book"
            src="compendium/dist/Dice & Destiny - ${title}"
            while IFS='|' read -r kind file label; do
              cp "${src} - ${file}.pdf" "release/dice-and-destiny-${slug}-${kind}.pdf"
              echo "release/dice-and-destiny-${slug}-${kind}.pdf#Dice & Destiny: ${label_title}, ${label}" >> "assets-${product}.txt"
            done <<'LIST'
          screen|Screen (color)|for reading on a screen (color, with links and bookmarks)
          home-print|Home Print (A4, B&W)|for printing at home (A4, black and white, with a front page)
          lulu-interior|Lulu Interior (A4, B&W)|Lulu hardcover interior (A4, black and white)
          lulu-cover|Lulu Hardcover Cover|Lulu hardcover cover (A4 casewrap)
          paperback-cover|Paperback Cover (color, 3 mm bleed)|paperback cover (A4, color, with 3 mm bleed)
          LIST
          done
          cat assets-compendium.txt assets-waking.txt assets-western-sea.txt
          test "$(wc -l < assets-compendium.txt)" -eq 10
          test "$(wc -l < assets-waking.txt)" -eq 5
          if [ "$western_sea" = true ]; then
            test "$(wc -l < assets-western-sea.txt)" -eq 5
          fi

      - name: Publish a preview release
        if: github.ref == 'refs/heads/main'
        run: |
          day=$(date -u +%Y.%m.%d)
          tag="preview-${day}-${GITHUB_SHA::7}"
          mapfile -t assets < <(cat assets-compendium.txt assets-waking.txt assets-western-sea.txt)
          gh release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Dice & Destiny preview ${day} (${GITHUB_SHA::7})" \
            --notes "Preview build of commit ${GITHUB_SHA}. This is not an edition."

      - name: Delete the old previews
        if: github.ref == 'refs/heads/main'
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("preview-"))] | sort_by(.createdAt) | reverse | .[env.KEEP_PREVIEWS | tonumber:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Publish an edition release
        if: startsWith(github.ref, 'refs/tags/edition-')
        run: |
          n="${GITHUB_REF_NAME#edition-}"
          mapfile -t assets < assets-compendium.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --latest \
            --title "Dice & Destiny: Edition ${n}" \
            --notes "Edition ${n} of Dice & Destiny."
          echo "ROLLING=compendium-latest" >> "$GITHUB_ENV"
          echo "PRODUCT=compendium" >> "$GITHUB_ENV"
          echo "ROLLING_TITLE=Dice & Destiny: the newest edition" >> "$GITHUB_ENV"
          echo "ROLLING_NOTES=The files of Edition ${n} (tag ${GITHUB_REF_NAME}). Each edition release replaces them." >> "$GITHUB_ENV"

      # REQUIRES is the Compendium edition that the book needs. Change it when a book needs a new edition.
      - name: Publish a Waking release
        if: startsWith(github.ref, 'refs/tags/dawnwatch-waking-')
        env:
          REQUIRES: "Edition 2"
        run: |
          n="${GITHUB_REF_NAME#dawnwatch-waking-}"
          mapfile -t assets < assets-waking.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --latest=false \
            --title "The Dawnwatch, Book One: Waking, version ${n}" \
            --notes "Version ${n} of The Dawnwatch, Book One: Waking. Requires ${REQUIRES} of the Dice & Destiny Compendiums."
          echo "ROLLING=dawnwatch-waking-latest" >> "$GITHUB_ENV"
          echo "PRODUCT=waking" >> "$GITHUB_ENV"
          echo "ROLLING_TITLE=The Dawnwatch, Book One: Waking: the newest version" >> "$GITHUB_ENV"
          echo "ROLLING_NOTES=The files of version ${n} (tag ${GITHUB_REF_NAME}). Requires ${REQUIRES} of the Dice & Destiny Compendiums. Each Waking release replaces them." >> "$GITHUB_ENV"

      # REQUIRES is the Compendium edition that the book needs. Change it when the book needs a new edition.
      - name: Publish a Beyond the Western Sea release
        if: startsWith(github.ref, 'refs/tags/western-sea-')
        env:
          REQUIRES: "Edition 2"
        run: |
          n="${GITHUB_REF_NAME#western-sea-}"
          mapfile -t assets < assets-western-sea.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --latest=false \
            --title "Beyond the Western Sea, version ${n}" \
            --notes "Version ${n} of Dice & Destiny: Beyond the Western Sea. Requires ${REQUIRES} of the Dice & Destiny Compendiums."
          echo "ROLLING=western-sea-latest" >> "$GITHUB_ENV"
          echo "PRODUCT=western-sea" >> "$GITHUB_ENV"
          echo "ROLLING_TITLE=Beyond the Western Sea: the newest version" >> "$GITHUB_ENV"
          echo "ROLLING_NOTES=The files of version ${n} (tag ${GITHUB_REF_NAME}). Requires ${REQUIRES} of the Dice & Destiny Compendiums. Each Beyond the Western Sea release replaces them." >> "$GITHUB_ENV"

      # The rolling release of a product keeps the same file names, so a link to a file always gives the newest version.
      # The step makes the release if it does not exist, and replaces its files. It does not move a tag or write a commit.
      - name: Replace the files of the rolling release
        if: env.ROLLING != ''
        run: |
          mapfile -t assets < "assets-${PRODUCT}.txt"
          if ! gh release view "$ROLLING" > /dev/null 2>&1; then
            gh release create "$ROLLING" --target "$GITHUB_SHA" --latest=false \
              --title "$ROLLING_TITLE" --notes "$ROLLING_NOTES"
          fi
          gh release upload "$ROLLING" "${assets[@]}" --clobber
          gh release edit "$ROLLING" --title "$ROLLING_TITLE" --notes "$ROLLING_NOTES" --latest=false
